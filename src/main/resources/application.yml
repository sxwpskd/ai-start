    name: ai-start
  #session
  session:
    store-type: redis
    # session过期时间 s
    timeout: 3600
    # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_demo
    username: root
    password: batxq396
  profiles:
    active: local
  #redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      ttl: 3600
server:
  port: 8100
  servlet:
    context-path: /ai  #便于区分前后端
    #cookie
    session:
      cookie:
        max-age: 3600
# springdoc-openapi项目配置
springdoc:

  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: org.aistart.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn