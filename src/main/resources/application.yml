spring:
  application:
    name: ai-start
server:
  port: 8100
  servlet:
    context-path: /ai  #便于区分前后端
# springdoc-openapi项目配置
springdoc:

  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: org.aistart.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn